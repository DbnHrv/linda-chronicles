<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmIntern — Intern</title>
<style>
  :root {
    /* Intern dashboard UI tokens (aligned with intern_dashboard_with_inventory.html) */
    --color-background-primary: #ffffff;
    --color-background-secondary: #f7f9fc;
    --color-background-tertiary: #eef2f7;
    --color-border-secondary: #d5dde8;
    --color-border-tertiary: #e5ebf3;
    --color-text-primary: #172231;
    --color-text-secondary: #425466;
    --color-text-tertiary: #75879c;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
    --accent-green: #1d9e75;
    /* Semantic palette — mapped to intern-style neutrals + accent */
    --teal-50: #e8f6f1; --teal-100: #c5ebdd; --teal-200: #6fcba8; --teal-500: var(--accent-green); --teal-700: #0f6d52; --teal-900: #03302a;
    --slate-50: var(--color-background-secondary); --slate-100: var(--color-border-tertiary); --slate-200: var(--color-border-secondary);
    --slate-400: var(--color-text-tertiary); --slate-600: var(--color-text-secondary); --slate-700: #2d3a47;
    --slate-800: var(--color-text-primary);
    --amber-50: #fffbeb; --amber-200: #fcd34d; --amber-600: #d97706;
    --sky-50: #f0f9ff; --sky-200: #bae6fd; --sky-600: #0284c7;
    --rose-50: #fff1f2; --rose-200: #fecdd3; --rose-600: #e11d48;
    --violet-50: #f5f3ff; --violet-200: #ddd6fe; --violet-600: #7c3aed;
    --font: "Segoe UI", Tahoma, Arial, sans-serif;
    --mono: Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .pims-root {
    font-family: var(--font);
    background: linear-gradient(180deg, #f4f8fc 0%, #ecf2f8 100%);
    min-height: 600px;
    color: var(--slate-800);
    font-size: 13px;
    padding: 16px;
  }

  .pims-app-shell {
    max-width: 1280px;
    margin: 0 auto;
    background: var(--color-background-tertiary);
    border: 1px solid #dde5ef;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(16, 42, 67, 0.08);
    display: flex;
    flex-direction: column;
    min-height: max(600px, calc(100vh - 32px));
  }

  /* NAV */
  .top-nav {
    background: var(--color-background-primary);
    border-bottom: 1px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 50px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--teal-700);
    letter-spacing: -0.3px;
  }
  .nav-brand svg rect { fill: rgba(29, 158, 117, 0.15); }
  .nav-brand svg path { stroke: var(--accent-green); }
  .nav-brand .pill {
    background: var(--teal-50); color: var(--teal-500);
    font-size: 10px; padding: 2px 7px; border-radius: 20px;
    font-family: var(--mono); font-weight: 500;
  }
  .nav-tagline { flex: 1; text-align: center; font-weight: 500; min-width: 0; }
  .nav-tabs { display: flex; gap: 2px; }
  .nav-tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 500; color: var(--slate-400);
    border: none; background: none; transition: all .15s;
  }
  .nav-tab:hover { background: var(--slate-50); color: var(--slate-600); }
  .nav-tab.active { background: var(--teal-50); color: var(--teal-700); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .role-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    font-weight: 500; cursor: pointer; transition: all .15s;
  }
  .role-hr { background: var(--violet-50); color: var(--violet-600); border: 1px solid var(--violet-200); }
  .role-intern { background: var(--sky-50); color: var(--sky-600); border: 1px solid var(--sky-200); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .av-hr { background: var(--violet-200); color: var(--violet-600); }
  .av-intern { background: var(--teal-100); color: var(--teal-700); }

  /* LAYOUT */
  .page-shell { display: flex; flex: 1; min-height: calc(600px - 50px); }
  .sidebar {
    width: 180px; min-width: 180px;
    background: var(--color-background-secondary);
    border-right: 1px solid var(--color-border-tertiary);
    padding: 16px 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar-section {
    padding: 0 12px 8px;
    font-size: 10px; font-weight: 600; letter-spacing: .8px;
    color: var(--slate-400); text-transform: uppercase;
    margin-top: 10px;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px; cursor: pointer;
    font-size: 12px; font-weight: 500;
    color: var(--slate-600);
    border-left: 2px solid transparent;
    transition: all .15s;
  }
  .sidebar-item:hover { background: var(--slate-50); color: var(--slate-800); }
  .sidebar-item.active {
    background: var(--color-background-primary);
    color: var(--accent-green);
    font-weight: 500;
    border-left-color: var(--accent-green);
  }
  .sidebar-item .ico { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-item .badge {
    margin-left: auto; background: var(--accent-green); color: white;
    font-size: 9px; padding: 1px 5px; border-radius: 10px; min-width: 16px; text-align: center;
  }

  .main-content { flex: 1; overflow: auto; background: var(--color-background-tertiary); }
  .page { display: none; padding: 20px; animation: fadeIn .2s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* COMMON */
  .page-header { margin-bottom: 18px; }
  .page-title { font-size: 18px; font-weight: 600; color: var(--slate-800); letter-spacing: -.4px; }
  .page-sub { font-size: 12px; color: var(--slate-400); margin-top: 3px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--slate-600); margin-bottom: 10px; }

  /* GRID / STATS */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-card {
    background: var(--color-background-primary);
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--slate-400); font-weight: 500; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 600; color: var(--slate-800); letter-spacing: -1px; }
  .stat-sub { font-size: 11px; color: var(--slate-400); margin-top: 3px; }
  .stat-teal .stat-value { color: var(--teal-500); }
  .stat-amber .stat-value { color: var(--amber-600); }
  .stat-rose .stat-value { color: var(--rose-600); }

  /* CARDS */
  .card {
    background: var(--color-background-primary);
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 7px; cursor: pointer;
    font-size: 12px; font-weight: 500; font-family: var(--font);
    border: 1px solid transparent; transition: all .15s;
  }
  .btn-primary { background: var(--teal-500); color: white; }
  .btn-primary:hover { background: var(--teal-700); }
  .btn-outline { background: white; color: var(--slate-600); border-color: var(--slate-200); }
  .btn-outline:hover { background: var(--slate-50); }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-danger { background: var(--rose-50); color: var(--rose-600); border-color: var(--rose-200); }
  .btn-amber { background: var(--amber-50); color: var(--amber-600); border-color: var(--amber-200); }

  /* TAGS / BADGES */
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600;
  }
  .tag-teal { background: var(--teal-50); color: var(--teal-500); }
  .tag-amber { background: var(--amber-50); color: var(--amber-600); }
  .tag-rose { background: var(--rose-50); color: var(--rose-600); }
  .tag-sky { background: var(--sky-50); color: var(--sky-600); }
  .tag-violet { background: var(--violet-50); color: var(--violet-600); }
  .tag-slate { background: var(--slate-100); color: var(--slate-600); }

  /* TABLE */
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th { text-align: left; padding: 8px 12px; background: var(--slate-50); color: var(--slate-400); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--slate-100); color: var(--slate-600); }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--slate-50); }

  /* FORM */
  .form-group { margin-bottom: 12px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--slate-600); margin-bottom: 5px; letter-spacing: .3px; }
  .form-label .req { color: var(--rose-600); }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 8px 11px; border: 1px solid var(--slate-200);
    border-radius: 7px; font-size: 12px; font-family: var(--font);
    color: var(--slate-800); background: white;
    transition: border .15s;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--teal-500);
    box-shadow: 0 0 0 3px rgba(13,140,105,.08);
  }
  .form-textarea { resize: vertical; min-height: 72px; }
  .form-hint { font-size: 10px; color: var(--slate-400); margin-top: 4px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* TASK BANDS */
  .task-band {
    border-radius: 10px; margin-bottom: 10px; overflow: hidden;
    border: 1px solid var(--slate-100);
  }
  .task-band-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .task-band-header .arrow { margin-left: auto; font-size: 10px; transition: transform .2s; }
  .task-band-header.open .arrow { transform: rotate(180deg); }
  .band-before-lunch .task-band-header { background: var(--teal-50); color: var(--teal-700); }
  .band-daily .task-band-header { background: var(--sky-50); color: var(--sky-600); }
  .band-before-close .task-band-header { background: var(--amber-50); color: var(--amber-600); }
  .band-weekly .task-band-header { background: var(--violet-50); color: var(--violet-600); }
  .task-band-body { background: white; }
  .task-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid var(--slate-100);
    font-size: 12px;
  }
  .task-row:last-child { border-bottom: none; }
  .task-row .task-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--slate-200); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .15s;
  }
  .task-row .task-check.done { background: var(--teal-500); border-color: var(--teal-500); color: white; font-size: 9px; }
  .task-name { flex: 1; color: var(--slate-700); }
  .task-name.done { text-decoration: line-through; color: var(--slate-400); }
  .task-time { font-family: var(--mono); font-size: 10px; color: var(--slate-400); }
  .task-assignee { font-size: 10px; color: var(--slate-400); }

  /* PROGRESS */
  .progress-bar {
    height: 5px; background: var(--slate-100); border-radius: 10px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--teal-500); border-radius: 10px; transition: width .4s; }
  .progress-fill.amber { background: var(--amber-600); }
  .progress-fill.rose { background: var(--rose-600); }

  /* TIMELINE */
  .timeline-item {
    display: flex; gap: 12px; margin-bottom: 14px;
  }
  .timeline-dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0;
    background: var(--teal-500);
  }
  .timeline-dot.pending { background: var(--amber-200); border: 2px solid var(--amber-600); width: 10px; height: 10px; margin-top: 3px; }
  .timeline-line {
    width: 1px; background: var(--slate-100); margin: 0 3px;
  }
  .timeline-content { flex: 1; }
  .timeline-meta { font-size: 10px; color: var(--slate-400); }
  .timeline-text { font-size: 12px; color: var(--slate-600); margin-top: 2px; }

  /* ORIENTATION STEPS */
  .orientation-step {
    display: flex; gap: 12px; padding: 12px;
    border: 1px solid var(--slate-100); border-radius: 8px;
    margin-bottom: 8px; background: white; cursor: pointer;
    transition: all .15s;
  }
  .orientation-step:hover { border-color: var(--teal-200); }
  .orientation-step.active { border-color: var(--teal-500); background: var(--teal-50); }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--slate-100); color: var(--slate-400);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .orientation-step.active .step-num { background: var(--teal-500); color: white; }
  .orientation-step.done .step-num { background: var(--teal-50); color: var(--teal-500); }
  .step-content .step-title { font-size: 12px; font-weight: 600; color: var(--slate-700); }
  .step-content .step-desc { font-size: 11px; color: var(--slate-400); margin-top: 2px; }

  /* LIVE FORM special */
  .live-form-banner {
    background: var(--teal-500); color: white;
    padding: 10px 16px; border-radius: 8px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .live-clock {
    font-family: var(--mono); font-size: 18px; font-weight: 500;
    letter-spacing: 1px;
  }
  .timer-badge {
    font-family: var(--mono); font-size: 12px;
    background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 6px;
  }
  .checkbox-group {
    display: flex; flex-direction: column; gap: 6px;
  }
  .checkbox-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border: 1px solid var(--slate-100); border-radius: 6px;
    cursor: pointer; transition: all .15s; font-size: 12px;
  }
  .checkbox-item:hover { background: var(--slate-50); }
  .checkbox-item input { accent-color: var(--teal-500); }
  .validation-error { font-size: 10px; color: var(--rose-600); margin-top: 3px; display: none; }
  .validation-error.show { display: block; }
  .submit-success {
    display: none; background: var(--teal-50); border: 1px solid var(--teal-200);
    border-radius: 8px; padding: 14px; text-align: center;
    color: var(--teal-700); font-size: 13px;
  }
  .submit-success.show { display: block; }
  .submit-success .big-check { font-size: 28px; margin-bottom: 6px; }
  .submit-success .success-title { font-weight: 600; font-size: 14px; }

  /* RULES list */
  .rule-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--slate-100);
    border-radius: 8px; margin-bottom: 6px; background: white;
  }
  .rule-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--slate-100); color: var(--slate-600);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .rule-text { font-size: 12px; color: var(--slate-700); flex: 1; }
  .rule-actions { display: flex; gap: 4px; }

  /* LOG MONITOR */
  .log-row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; border-bottom: 1px solid var(--slate-100);
    font-size: 12px;
  }
  .log-time { font-family: var(--mono); font-size: 10px; color: var(--slate-400); min-width: 54px; margin-top: 1px; }
  .log-intern { font-weight: 600; color: var(--slate-700); min-width: 80px; }
  .log-detail { color: var(--slate-600); flex: 1; }
  .log-task { font-size: 10px; color: var(--slate-400); }

  /* SCROLLABLE */
  .scroll-area { max-height: 340px; overflow-y: auto; }
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--slate-200); border-radius: 4px; }

  /* INTERN TASK CARD */
  .intern-task {
    border: 1px solid var(--slate-100); border-radius: 8px;
    padding: 12px; margin-bottom: 8px; background: white;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all .15s;
  }
  .intern-task:hover { border-color: var(--teal-200); box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .intern-task .task-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .icon-teal { background: var(--teal-50); }
  .icon-sky { background: var(--sky-50); }
  .icon-amber { background: var(--amber-50); }
  .icon-violet { background: var(--violet-50); }
  .intern-task-info { flex: 1; }
  .intern-task-name { font-size: 12px; font-weight: 600; color: var(--slate-700); }
  .intern-task-meta { font-size: 11px; color: var(--slate-400); margin-top: 2px; }
  .intern-task-status { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 30px; color: var(--slate-400); font-size: 12px; }
  .empty .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* NOTIFICATION DOT */
  .notif { position: relative; }
  .notif-dot {
    position: absolute; top: -2px; right: -2px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--rose-600); border: 1.5px solid white;
  }

  .divider { border: none; border-top: 1px solid var(--slate-100); margin: 14px 0; }

  .inline-tip {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--sky-50); border: 1px solid var(--sky-200);
    border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 11px;
    color: var(--sky-600); margin-bottom: 12px;
  }

  /* Intern dashboard page — matches intern_dashboard greeting + panels */
  .intern-dash-greeting {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.2px;
    color: var(--color-text-primary);
  }
  .intern-dash-sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
  .intern-timeline-compact .timeline-item { margin-bottom: 8px; }
  .intern-timeline-compact .timeline-item:last-child { margin-bottom: 0; }

  /* PRODUCT INVENTORY (report-style + live-form panel) */
  .inv-report-head {
    display: flex; flex-wrap: wrap; gap: 12px 20px; justify-content: space-between; align-items: flex-start;
    margin-bottom: 16px; font-size: 12px; color: var(--slate-600);
    padding: 14px 16px; background: var(--color-background-primary);
    border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg);
    box-shadow: 0 1px 3px rgba(16, 42, 67, 0.04);
  }
  .inv-report-head .co { line-height: 1.45; }
  .inv-report-head .co strong { color: var(--slate-800); font-size: 13px; display: block; margin-bottom: 2px; }
  .inv-meta { text-align: right; }
  .inv-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
    padding: 14px 18px; margin-bottom: 16px;
    background: linear-gradient(135deg, #0f6d52 0%, var(--teal-500) 48%, #1a9a72 100%);
    border-radius: var(--border-radius-lg);
    box-shadow: 0 4px 14px rgba(15, 109, 82, 0.22);
    border: 1px solid rgba(255,255,255,.12);
  }
  .inv-banner-title {
    font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -0.2px;
  }
  .inv-banner-sub {
    font-size: 12px; color: rgba(255,255,255,.88); margin-top: 4px; font-weight: 400;
  }
  .inv-banner-note {
    font-size: 11px; color: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  }
  .inv-stats-row .stat-card.stat-peso .stat-value { color: var(--teal-500); }
  .inv-filter-card {
    box-shadow: 0 1px 3px rgba(16, 42, 67, 0.05);
  }

const CURRENT_INTERN_ALIASES = ['juan reyes', 'j. reyes'];

const internPages = [

function isTaskForCurrentIntern(assignee = '') {
  const normalized = assignee.trim().toLowerCase();
  if (!normalized) return false;
  if (normalized.includes('all interns') || normalized.includes('rotation')) return true;
  const assignees = normalized.split(',').map(n => n.trim());
  return assignees.some(name => CURRENT_INTERN_ALIASES.includes(name));
}

function getAssignedTaskBandsForIntern() {
  const fallback = [
    { id:'bl', cls:'band-before-lunch', label:'Before Lunch', ico:'🌅', time:'By 12:00', tasks:[
      {id:'t_bl1',name:'Pill Counting & Verification',note:'Count trays 1–4. Record any discrepancies.',done:true},
      {id:'t_bl2',name:'Label Accuracy Check',note:'Cross-check label details on dispensed items.',done:true},
      {id:'t_bl3',name:'Morning Drug Tray Setup',note:'Arrange daily dispensing trays per protocol.',done:false},
    ]},
    { id:'d', cls:'band-daily', label:'Daily Tasks', ico:'📅', time:'All Day', tasks:[
      {id:'t_d1',name:'Patient Queue Assistance',note:'Assist licensed pharmacist with queue management.',done:false},
      {id:'t_d2',name:'Drug Counseling Observation',note:'Observe and take notes on counseling sessions.',done:false},
    ]},
    { id:'cl', cls:'band-before-close', label:'Before Closing', ico:'🌙', time:'By 17:30', tasks:[
      {id:'t_cl1',name:'End-of-Day Inventory Count',note:'Count and record remaining high-value items.',done:false},
    ]},
  ];
  try {
    const raw = localStorage.getItem(TASK_STORAGE_KEY);
    if (!raw) return fallback;
    const sourceBands = JSON.parse(raw);
    if (!Array.isArray(sourceBands) || sourceBands.length === 0) return fallback;
    const metaBySlot = {
      bl: { cls:'band-before-lunch', label:'Before Lunch', ico:'🌅', time:'By 12:00' },
      d: { cls:'band-daily', label:'Daily Tasks', ico:'📅', time:'All Day' },
      cl: { cls:'band-before-close', label:'Before Closing', ico:'🌙', time:'By 17:30' },
      wk: { cls:'band-weekly', label:'Weekly Tasks', ico:'📆', time:'Every Monday' },
    };
    const mapped = sourceBands.map(b => {
      const meta = metaBySlot[b.id] || { cls:'band-daily', label:'Tasks', ico:'📌', time:'Today' };
      const tasks = (b.tasks || []).filter(t => isTaskForCurrentIntern(t.assignee)).map(t => ({
        id: `hr_${t.id}`,
        name: t.name,
        note: t.note && t.note.trim() ? t.note : `Assigned by HR · ${t.assignee || 'Intern'}`,
        done: false,
      }));
      return { id: b.id, cls: meta.cls, label: meta.label, ico: meta.ico, time: meta.time, tasks };
    }).filter(b => b.tasks.length > 0);
    return mapped.length ? mapped : fallback;
  } catch (e) {
    return fallback;
  }
}

function getHROrientationModules() {
  const fallback = [
    {id:'ori1', n:1, title:'Welcome & Company Overview', done:true, time:'30 min'},
    {id:'ori2', n:2, title:'Pharmacy Layout & Zones', done:true, time:'45 min'},
    {id:'ori3', n:3, title:'Drug Classification Basics', done:false, active:true, time:'60 min'},
    {id:'ori4', n:4, title:'Documentation & Record-Keeping', done:false, time:'45 min'},
    {id:'ori5', n:5, title:'Safety & Emergency Protocols', done:false, time:'30 min'},
  ];
  try {
    const raw = localStorage.getItem(ORIENTATION_STORAGE_KEY);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) return fallback;
    return parsed;
  } catch (e) {
    return fallback;
  }
}

function renderSidebar() {
  const el = document.getElementById('sidebar-content');

  internPages.forEach(p => {
    if (p.section !== lastSection) {
      html += `<div class="sidebar-section">${p.section}</div>`;
      lastSection = p.section;
    }
    html += `<div class="sidebar-item ${p.id===currentPage?'active':''}" onclick="navigate('${p.id}')" id="nav-${p.id}">
      <span class="ico">${p.ico}</span>
      <span>${p.label}</span>
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
    </div>`;
  });
  el.innerHTML = html;
}

function navigate(pageId) {
  currentPage = pageId;

/** Philippine peso display (values stored as numbers; label uses ₱) */
function invFmtPeso(n, minFrac, maxFrac) {
  const x = Number(n);
  if (Number.isNaN(x)) return '₱0';
  return '₱' + x.toLocaleString('en-US', { minimumFractionDigits: minFrac, maximumFractionDigits: maxFrac });
}

function invEsc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function invStockStatus(p) {
  if (p.oh === 0) return 'out';
  if (p.rp > 0 && p.oh <= p.rp) return 'low';
  return 'ok';
}
function invBadge(p) {
  const s = invStockStatus(p);
  if (s === 'out') return '<span class="tag tag-rose">Out</span>';
  if (s === 'low') return '<span class="tag tag-amber">Low</span>';
  return '<span class="tag tag-teal">OK</span>';
}
function invOHVal(p) { return (p.oh * p.ac); }

function invGetViewRows() {
  const q = (document.getElementById('inv-srch') || { value: '' }).value.trim().toLowerCase();
  const mfr = (document.getElementById('inv-mfr') || { value: '' }).value;
  const fst = (document.getElementById('inv-fstat') || { value: '' }).value;
  const sort = (document.getElementById('inv-sort') || { value: 'generic' }).value;
  let list = invProds.map((p, i) => ({ p, i }));
  list = list.filter(({ p }) => {
    if (mfr && p.mfr !== mfr) return false;
    if (fst && invStockStatus(p) !== fst) return false;
    if (!q) return true;
    return p.din.includes(q) || p.trade.toLowerCase().includes(q) || p.generic.toLowerCase().includes(q);
  });
  list.sort((a, b) => (sort === 'trade'
    ? a.p.trade.localeCompare(b.p.trade)
    : a.p.generic.localeCompare(b.p.generic)));
  return list;
}

function invUpdateStats() {
  const totVal = invProds.reduce((a, p) => a + invOHVal(p), 0);
  const byId = (id) => document.getElementById(id);
  const n = byId('inv-st-sku'); if (n) n.textContent = invProds.length;
  const v = byId('inv-st-val'); if (v) v.textContent = invFmtPeso(totVal, 2, 2);
  const lo = byId('inv-st-low'); if (lo) lo.textContent = invProds.filter(p => invStockStatus(p) === 'low').length;
  const ou = byId('inv-st-out'); if (ou) ou.textContent = invProds.filter(p => invStockStatus(p) === 'out').length;
  const bar = byId('inv-total-bar'); if (bar) bar.textContent = invFmtPeso(totVal, 4, 4);
}

function invRenderTable() {
  const tb = document.getElementById('inv-tbody');
  if (!tb) return;
  const rows = invGetViewRows();
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="18" style="text-align:center;padding:20px;color:var(--slate-400)">No rows match filters.</td></tr>';
    invUpdateStats();
    return;
  }
  tb.innerHTML = rows.map(({ p, i }) => {
    const ohv = invOHVal(p);
    const sel = invSelIdx === i ? ' inv-row-sel' : '';
    return `<tr class="${sel}" onclick="invSelectRow(${i})">
      <td style="font-family:var(--mono);font-size:10px">${invEsc(p.din)}</td>
      <td class="wrap">${invEsc(p.trade)}</td>
      <td class="wrap">${invEsc(p.generic)}</td>
      <td>${invEsc(p.str)}</td>
      <td>${invEsc(p.form)}</td>
      <td>${invEsc(p.mfr)}</td>
      <td class="wrap">${invEsc(p.desc)}</td>
      <td class="num">${p.invNum}</td>
      <td class="num">${p.packSize}</td>
      <td class="num">${p.oh.toLocaleString()}</td>
      <td class="num">${p.rp}</td>
      <td class="num">${p.numPacks}</td>
      <td class="num">${p.qtyDisp}</td>
      <td class="num">${invFmtPeso(p.sc, 4, 4)}</td>
      <td class="num">${invFmtPeso(p.ac, 4, 4)}</td>
      <td class="num">${invFmtPeso(ohv, 4, 4)}</td>
      <td>${invBadge(p)}</td>
      <td class="num" onclick="event.stopPropagation()">
        <button type="button" class="btn btn-outline btn-sm" onclick="invSelectRow(${i})">Edit</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="invSelectRow(${i});invPromptDelete()">Del</button>
      </td>
    </tr>`;
  }).join('');
  invUpdateStats();
}

  return {

function invUpdateOhValPreview() {

function invShowEditor(show) {
  document.getElementById('inv-form-placeholder').style.display = show ? 'none' : 'block';
  document.getElementById('inv-form-editor').style.display = show ? 'block' : 'none';
  document.getElementById('inv-btn-del').style.display = (show && invMode === 'edit') ? 'inline-flex' : 'none';
}
function invSelectRow(globalIdx) {
  invMode = 'edit';
  invSelIdx = globalIdx;
  const p = invProds[globalIdx];
  if (!p) return;
  invFillForm(p);
  invShowEditor(true);
  invRenderTable();
}
function invStartAdd() {
  invMode = 'add';
  invSelIdx = null;
  ['inv-f-din','inv-f-mfr','inv-f-trade','inv-f-generic','inv-f-str','inv-f-desc'].forEach(id => { const n = document.getElementById(id); if (n) n.value = ''; });
  document.getElementById('inv-f-form').value = 'TABLET';
  ['inv-f-invnum','inv-f-pack','inv-f-oh','inv-f-rp','inv-f-pks','inv-f-qtyd'].forEach(id => { const n = document.getElementById(id); if (n) n.value = ''; });
  document.getElementById('inv-f-mfr').value = 'GEN';
  document.getElementById('inv-f-sc').value = '';
  document.getElementById('inv-f-ac').value = '';
  invUpdateOhValPreview();
  invShowEditor(true);
  invRenderTable();
}
function invCancelEdit() {
  invMode = null;
  invSelIdx = null;
  invShowEditor(false);
  invRenderTable();
}
function invSave() {
  const x = invReadForm();
  if (!x.din || !x.trade || !x.generic || !x.mfr) { alert('DIN, manufacturer, trade name, and generic name are required.'); return; }
  if (x.oh < 0 || x.rp < 0 || x.sc < 0 || x.ac < 0) { alert('Numeric values cannot be negative.'); return; }
  if (invMode === 'edit' && invSelIdx !== null) {
    invProds[invSelIdx] = x;
  } else {
    invProds.push(x);
    invSelIdx = invProds.length - 1;
    invMode = 'edit';
  }
  invFillForm(invProds[invSelIdx]);
  invShowEditor(true);
  invRenderTable();
}
function invPromptDelete() {
  if (invMode !== 'edit' || invSelIdx === null) { alert('Select a row first.'); return; }
  invDelIdx = invSelIdx;
  document.getElementById('inv-del-modal').classList.add('show');
  document.getElementById('inv-del-modal').setAttribute('aria-hidden', 'false');
}
function invCloseDelModal() {
  document.getElementById('inv-del-modal').classList.remove('show');
  document.getElementById('inv-del-modal').setAttribute('aria-hidden', 'true');
  invDelIdx = null;
}
function invConfirmDelete() {
  if (invDelIdx === null) return;
  invProds.splice(invDelIdx, 1);
  invCloseDelModal();
  invCancelEdit();
  invRenderTable();
}
function initInvPage() {
  invRenderTable();
}

function invOpenReportModal() {
  const modal = document.getElementById('inv-report-modal');
  const dateInput = document.getElementById('inv-report-date');
  if (dateInput && !dateInput.value) {
    dateInput.value = new Date().toISOString().slice(0, 10);
  }
  if (modal) {
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
  }
}

function invCloseReportModal() {
  const modal = document.getElementById('inv-report-modal');
  if (modal) {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
  }
}

function toggleBand(id) {
  const body = document.getElementById('body-' + id);
  const header = body.previousElementSibling;
  if (body.style.display === 'none') {
    body.style.display = '';
    header.classList.add('open');
  } else {
    body.style.display = 'none';
    header.classList.remove('open');
  }
}

function toggleCheck(id) {
  const chk = document.getElementById('chk-' + id);
  const name = document.getElementById('tname-' + id);
  if (!chk) return;
  const isDone = chk.classList.toggle('done');
  chk.textContent = isDone ? '✓' : '';
  if (name) {
    name.classList.toggle('done', isDone);
    name.style.textDecoration = isDone ? 'line-through' : '';
    name.style.color = isDone ? 'var(--slate-400)' : '';
  }
}

function selectOriStep(el) {
  document.querySelectorAll('.orientation-step').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function addRule() {}

function initTaskToggles() {}

function initLiveForm() {
  if (liveTimer) clearInterval(liveTimer);
  formStartTime = new Date();
  seconds = 0;
  // Set default start time
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const startEl = document.getElementById('start-time');
  if (startEl) startEl.value = hh + ':' + mm;

  // Duration auto-calc
  const endEl = document.getElementById('end-time');
  if (endEl) endEl.addEventListener('change', calcDuration);
  if (startEl) startEl.addEventListener('change', calcDuration);

  liveTimer = setInterval(() => {
    seconds++;
    const clockEl = document.getElementById('live-clock');
    const timerEl = document.getElementById('session-timer');
    const now2 = new Date();
    if (clockEl) clockEl.textContent = now2.toTimeString().slice(0,8);
    if (timerEl) {
      const m = Math.floor(seconds/60).toString().padStart(2,'0');
      const s = (seconds%60).toString().padStart(2,'0');
      timerEl.textContent = m+':'+s;
    }
  }, 1000);
}

function calcDuration() {
  const s = document.getElementById('start-time')?.value;
  const e = document.getElementById('end-time')?.value;
  const d = document.getElementById('duration-display');
  if (s && e && d) {
    const [sh,sm] = s.split(':').map(Number);
    const [eh,em] = e.split(':').map(Number);
    const diff = (eh*60+em) - (sh*60+sm);
    if (diff > 0) d.value = diff + ' min';
    else d.value = '';
  }
}

function submitLog() {
  let valid = true;

  const slotEl = document.getElementById('slot-select');
  const taskEl = document.getElementById('task-select');
  const startEl = document.getElementById('start-time');
  const endEl = document.getElementById('end-time');
  const checks = document.querySelectorAll('#task-checklist input:checked');

  if (!slotEl?.value) { document.getElementById('err-slot').classList.add('show'); valid=false; }
  else { document.getElementById('err-slot').classList.remove('show'); }

  if (!taskEl?.value) { document.getElementById('err-task').classList.add('show'); valid=false; }
  else { document.getElementById('err-task').classList.remove('show'); }

  if (!startEl?.value) { document.getElementById('err-start').classList.add('show'); valid=false; }
  else { document.getElementById('err-start').classList.remove('show'); }

  if (!endEl?.value) { document.getElementById('err-end').classList.add('show'); valid=false; }
  else { document.getElementById('err-end').classList.remove('show'); }

  if (checks.length === 0) { document.getElementById('err-check').classList.add('show'); valid=false; }
  else { document.getElementById('err-check').classList.remove('show'); }

  if (!valid) return;

  clearInterval(liveTimer);
  document.getElementById('log-form').style.display = 'none';
  const success = document.getElementById('form-success');
  success.classList.add('show');
  const now = new Date();
  document.getElementById('submit-time').textContent = now.toTimeString().slice(0,8);
}

function resetForm() {
  const form = document.getElementById('log-form');
  const success = document.getElementById('form-success');
  if (form) form.style.display = '';
  if (success) success.classList.remove('show');
  seconds = 0;
  initLiveForm();
}
